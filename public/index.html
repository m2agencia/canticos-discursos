<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cânticos para Discursos Públicos</title>
    
    <!-- PWA Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e8ecf1; 
            margin: 0; 
            padding: 15px; 
            color: #333; 
        }
        .page { 
            max-width: 650px; 
            width: 100%;
            margin: 0 auto; 
        }

        /* Card base */
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
            overflow: hidden;
        }

        /* Card 1 - Cabeçalho */
        .card-header {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            color: #fff;
            text-align: center;
            padding: 28px 20px;
        }
        .card-header h1 {
            margin: 0;
            font-size: 1.8em;
            line-height: 1.2;
        }
        .card-header .subtitle {
            margin-top: 6px;
            font-size: 0.95em;
            opacity: 0.85;
        }

        /* Card 2 - Busca */
        .card-search {
            padding: 20px;
        }
        .card-search label {
            display: block;
            text-align: center;
            font-size: 1em;
            color: #333;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .card-search label span {
            color: #888;
            font-weight: normal;
            font-size: 0.9em;
        }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 100%; background: #fff; }
        input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
        button { padding: 12px 24px; font-size: 16px; background-color: #4a90e2; color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background-color: #357abd; }

        /* Card 3 - Tema/Resumo */
        .card-tema {
            padding: 20px;
            border-left: 5px solid #4a90e2;
        }
        .tema-titulo { 
            font-weight: bold; 
            font-size: 1.1em; 
            margin-bottom: 12px; 
            color: #1a5276;
            text-transform: uppercase;
        }
        .tema-resumo { font-size: 0.95em; color: #444; line-height: 1.6; }

        /* Subtítulo sugestões */
        .sugestoes-titulo {
            color: #4a90e2;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 0;
            padding: 0 4px;
        }

        /* Cards individuais - Cânticos */
        .card-cantico {
            padding: 18px 20px;
        }
        .song-title { 
            font-weight: bold; 
            font-size: 1.05em; 
            color: #2c3e50; 
            margin-bottom: 10px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 10px; 
        }
        .song-reason { color: #555; font-size: 0.9em; line-height: 1.6; }
        .reason-bold { font-weight: bold; color: #e67e22; }
        
        .result { margin-top: 0; }

        @media (max-width: 400px) {
            .card-header h1 { font-size: 1.5em; }
            .card-header { padding: 22px 15px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Card 1: Cabeçalho -->
        <div class="card card-header">
            <h1>Cânticos para Discursos</h1>
            <div class="subtitle">Guia Prático para escolha</div>
        </div>

        <!-- Card 2: Busca -->
        <div class="card card-search">
            <label for="numero">Digite o número do Discurso: <span>[ Ex: 1, 37, 102 ]</span></label>
            <div class="input-group">
                <input type="number" id="numero" placeholder="Ex: 1, 37, 102">
                <button onclick="buscar()">Buscar</button>
            </div>
        </div>

        <!-- Resultados -->
        <div class="result" id="result"></div>
    </div>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker registrado com sucesso!', reg.scope);
                }).catch(err => {
                    console.warn('Falha no registro do Service Worker', err);
                });
            });
        }

        const cacheBuster = new Date().getTime();
        let db = null;

        fetch('db_canticos.json?v=' + cacheBuster)
            .then(res => res.json())
            .then(data => { db = data; })
            .catch(err => console.error('Erro ao carregar banco:', err));

        function buscar() {
            const num = document.getElementById('numero').value;
            const resultDiv = document.getElementById('result');

            if (!num) return alert('Digite um número.');
            if (!db) return alert('Banco de dados carregando... Aguarde.');

            resultDiv.innerHTML = '';
            const discurso = db[num];

            if (!discurso) {
                resultDiv.innerHTML = `<div class="card" style="padding:20px;"><p style="color:red; text-align:center; margin:0;">Erro: Discurso ${num} não encontrado no banco.</p></div>`;
                return;
            }

            let html = '';

            // Card 3: Tema + Resumo
            html += `
            <div class="card card-tema">
                <div class="tema-titulo">TEMA: ${discurso.tema.toUpperCase()}</div>
                <div class="tema-resumo"><strong>Resumo do Esboço:</strong> ${discurso.resumo}</div>
            </div>`;

            // Subtítulo
            html += `<h3 class="sugestoes-titulo">3 Excelentes Sugestões:</h3>`;

            // Cards individuais para cada cântico
            discurso.sugestoes.forEach((song, index) => {
                let motivoTexto = song.motivo;
                if(motivoTexto.includes("Por que escolher")) {
                    motivoTexto = motivoTexto.replace("Por que escolher", "<span class='reason-bold'>Por que escolher</span>");
                }

                html += `
                <div class="card card-cantico">
                    <div class="song-title">${index + 1}. Cântico ${song.numero}: "${song.titulo}"</div>
                    <div class="song-reason">${motivoTexto}</div>
                </div>`;
            });

            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
